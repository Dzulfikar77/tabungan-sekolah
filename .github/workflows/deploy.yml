name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build
        env:
          # Fallback = nilai publik yang sudah ada di .env.example.
          # Bisa di-override lewat GitHub Secrets (VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY).
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://flcswakrpxhsoxnvwdba.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_FVtIAKqKkZQ67uqzPtD4TQ_MyUSs8Te' }}

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
